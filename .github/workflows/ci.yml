name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # ── 백엔드: 린트 + 테스트 ──
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    env:
      KIS_USE_MOCK: "1"   # CI는 mock 데이터로 (실키 불필요)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check src/ tests/ main_api.py

      - name: Format check (ruff)
        run: ruff format --check src/ tests/ main_api.py
        continue-on-error: true   # 포맷은 경고만 (점진 적용)

      - name: Run tests
        run: pytest tests/ -q --tb=short

  # ── 프론트엔드: 타입체크 + 빌드 ──
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npx next build

  # ── E2E: Playwright (real backend in mock mode + real frontend) ──
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      KIS_USE_MOCK: "1"
      DATABASE_URL: "sqlite:////tmp/e2e_ci.db"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npx next build

      - name: Run Playwright E2E
        working-directory: frontend
        # playwright.config webServer boots main_api (:8000) + next start (:3000).
        # No PW_CHROMIUM_PATH → config uses the chromium Playwright just installed.
        run: npx playwright test
