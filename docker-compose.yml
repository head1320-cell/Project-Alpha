
services:

  # ─── PostgreSQL Database ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ficc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-ficc_user}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-ficc_password}
      POSTGRES_DB: ${PG_DATABASE:-ficc_risk}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - ficc_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-ficc_user} -d ${PG_DATABASE:-ficc_risk}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Backend (FastAPI) ────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        # 빌드 식별자 (AM6). `.dockerignore` 가 `.git` 을 빼므로 컨테이너 안에서는
        # 측정이 불가능하고, 이 주입이 유일한 경로다. 비워 두면 기록이 미상으로
        # 남는다 — ★조용한 "dev" 로 남지는 않는다★.
        #   GIT_SHA=$(git rev-parse HEAD) docker compose build backend
        GIT_SHA: ${GIT_SHA:-}
    container_name: ficc_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    # .env 없어도 기동 (아래 environment의 기본값 사용). 실키는 .env에 넣으면 자동 주입.
    env_file:
      - path: .env
        required: false
    environment:
      PG_HOST: db
      PG_PORT: 5432
      PG_USER: ${PG_USER:-ficc_user}
      PG_PASSWORD: ${PG_PASSWORD:-ficc_password}
      PG_DATABASE: ${PG_DATABASE:-ficc_risk}
      DATABASE_URL_ASYNC: postgresql+asyncpg://${PG_USER:-ficc_user}:${PG_PASSWORD:-ficc_password}@db:5432/${PG_DATABASE:-ficc_risk}
      KIS_USE_MOCK: ${KIS_USE_MOCK:-1}
      KIS_IS_PAPER: ${KIS_IS_PAPER:-1}
      KIS_APP_KEY: ${KIS_APP_KEY:-}
      KIS_APP_SECRET: ${KIS_APP_SECRET:-}
      KIS_ACCOUNT_NO: ${KIS_ACCOUNT_NO:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ficc_net
    healthcheck:
      test: ["CMD", "python", "-c",
             "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─── Frontend (Next.js 14) ───────────────────────────────────────────────
  # 변경: Streamlit(8501) → Next.js(3000)
  # API 주소는 빌드에 넣지 않는다 — 아래 environment 의 BACKEND_URL 을 런타임 프록시가 요청마다 읽는다.
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ficc_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Next 서버(런타임)가 /api/backend/* 를 백엔드 컨테이너로 프록시할 주소
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ficc_net

# ─── Shared network ──────────────────────────────────────────────────────────
networks:
  ficc_net:
    driver: bridge

# ─── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  pg_data:
